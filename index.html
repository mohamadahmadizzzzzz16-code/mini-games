<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منچ ساده</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #eee; }
  .grid { 
    display: grid; grid-template-columns: repeat(15, 20px); 
    justify-content: center; margin-top: 20px;
  }
  .cell { width: 20px; height: 20px; border: 1px solid #ccc; background: #fff; }
  .red { background: red; } .blue { background: blue; }
  .green { background: green; } .yellow { background: yellow; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 18px; }
</style>
</head>
<body>
  <h3>بازی منچ</h3>
  <div class="grid" id="board"></div>
  <button onclick="alert('تاس: ' + (Math.floor(Math.random()*6)+1))">پرتاب تاس</button>

  <script>
    const board = document.getElementById('board');
    for(let i=0; i<225; i++) {
      let cell = document.createElement('div');
      cell.className = 'cell';
      let r = Math.floor(i/15), c = i%15;
      if(r<6 && c<6) cell.classList.add('red');
      else if(r<6 && c>8) cell.classList.add('green');
      else if(r>8 && c<6) cell.classList.add('blue');
      else if(r>8 && c>8) cell.classList.add('yellow');
      board.appendChild(cell);
    }
  </script>
</body>
</html>

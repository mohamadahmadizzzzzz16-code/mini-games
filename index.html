<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>بازی‌های سه‌بعدی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at center, #1e1e2f 0%, #0d0e15 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 10px;
    }
    .screen { display: none; width: 100%; max-width: 420px; flex-direction: column; align-items: center; }
    .screen.active { display: flex; }

    h1 { font-size: 20px; color: #f5c2e7; margin-bottom: 8px; text-shadow: 0 4px 10px rgba(245,194,231,0.3); }

    /* دکمه‌های شیشه‌ای مدرن */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #89b4fa, #74c7ec);
      box-shadow: 0 6px 15px rgba(116, 199, 236, 0.35);
      transition: all 0.2s ease;
      margin: 6px;
    }
    .btn:active { transform: translateY(2px) scale(0.97); }
    .btn-green { background: linear-gradient(135deg, #a6e3a1, #94e2d5); color: #11111b; box-shadow: 0 6px 15px rgba(166, 227, 161, 0.35); }
    .btn-red { background: linear-gradient(135deg, #f38ba8, #eba0ac); color: #11111b; box-shadow: 0 6px 15px rgba(243, 139, 168, 0.35); }
    .btn-back { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); color: #cdd6f4; border: 1px solid rgba(255,255,255,0.1); }

    /* نشانگر بازیکنان */
    .players-bar { display: flex; gap: 10px; margin-bottom: 10px; }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      opacity: 0.4;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .badge.p1 { background: #f38ba8; color: #111; }
    .badge.p2 { background: #89b4fa; color: #111; }
    .badge.active { opacity: 1; border-color: #fff; transform: scale(1.08); box-shadow: 0 0 15px currentColor; }

    /* تاس سه بعدی */
    .dice-container {
      perspective: 600px;
      margin: 8px 0;
    }
    .dice-3d {
      width: 55px;
      height: 55px;
      background: linear-gradient(145deg, #ffffff, #e0e0e0);
      color: #111;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 2px 4px #fff, inset 0 -3px 6px rgba(0,0,0,0.2);
      transform: rotateX(15deg) rotateY(-10deg);
      transition: transform 0.2s ease;
    }
    .dice-3d:active { transform: scale(0.9) rotateX(0deg); }
    .info-msg { font-size: 13px; color: #fab387; min-height: 20px; margin-bottom: 6px; font-weight: bold; }

    /* نمای سه بعدی پرسپکتیو برای تخته */
    .board-viewport {
      perspective: 900px;
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto;
    }
    .board-3d {
      transform-style: preserve-3d;
      transform: rotateX(32deg) rotateZ(0deg);
      box-shadow: 0 25px 40px rgba(0,0,0,0.7), 0 10px 0 #11111b;
      border-radius: 12px;
      background: #181825;
      padding: 4px;
      border: 2px solid #313244;
      transition: transform 0.4s ease;
    }

    /* تخته مار و پله */
    .snake-table { border-collapse: collapse; }
    .snake-table td {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      font-size: 8px;
      color: #6c7086;
      vertical-align: top;
      padding: 1px;
      background: #1e1e2e;
    }
    td.snake-box { background: rgba(243, 139, 168, 0.22); color: #f38ba8; font-weight: bold; }
    td.ladder-box { background: rgba(166, 227, 161, 0.22); color: #a6e3a1; font-weight: bold; }
    td.goal-box { background: radial-gradient(circle, #f9e2af 0%, #fab387 100%); color: #111; font-weight: bold; }

    /* مهره‌های سه‌بعدی با پایه سایه‌دار */
    .p-token {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(8px);
      box-shadow: 0 6px 8px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.8);
      z-index: 5;
    }
    .token-p1 { background: radial-gradient(circle at 30% 30%, #ff7b93, #b81434); border: 1px solid #ffccd5; }
    .token-p2 { background: radial-gradient(circle at 30% 30%, #89dceb, #1e66f5); border: 1px solid #c9ebff; }

    /* تخته منچ */
    .ludo-table { border-collapse: collapse; }
    .ludo-table td {
      width: 21px;
      height: 21px;
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
      background: #1e1e2e;
    }
    .base-red { background: rgba(243, 139, 168, 0.35) !important; }
    .base-blue { background: rgba(137, 180, 250, 0.35) !important; }
    .path-red { background: #f38ba8 !important; }
    .path-blue { background: #89b4fa !important; }
    .center-box { background: #f9e2af !important; text-align: center; font-size: 10px; line-height: 21px; }

    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>

<div id="screen-menu" class="screen active">
  <h1 style="font-size: 24px; margin-bottom: 20px;">🎲 مینی‌اپ بازی‌های ۳ بعدی</h1>
  <div style="display: flex; flex-direction: column; gap: 15px; width: 80%;">
    <button class="btn btn-green" onclick="openGame('snake')">🐍 مار و پله ۳ بعدی</button>
    <button class="btn btn-red" onclick="openGame('ludo')">🎲 منچ ۳ بعدی</button>
  </div>
</div>

<!-- مار و پله -->
<div id="screen-snake" class="screen">
  <h1>🐍 مار و پله ۳ بعدی</h1>
  <div class="players-bar">
    <div id="sp-1" class="badge p1 active">بازیکن ۱ 🔴</div>
    <div id="sp-2" class="badge p2">بازیکن ۲ 🔵</div>
  </div>
  <div class="dice-container" onclick="rollSnake()">
    <div id="s-dice" class="dice-3d">🎲</div>
  </div>
  <div id="s-msg" class="info-msg">روی تاس بزنید!</div>
  
  <div class="board-viewport">
    <div class="board-3d">
      <table id="snake-grid" class="snake-table"></table>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-back" onclick="openMenu()">منو</button>
    <button class="btn btn-back" onclick="resetSnake()">دوباره 🔄</button>
  </div>
</div>

<!-- منچ -->
<div id="screen-ludo" class="screen">
  <h1>🎲 منچ ۳ بعدی</h1>
  <div class="players-bar">
    <div id="lp-1" class="badge p1 active">بازیکن ۱ 🔴</div>
    <div id="lp-2" class="badge p2">بازیکن ۲ 🔵</div>
  </div>
  <div class="dice-container" onclick="rollLudo()">
    <div id="l-dice" class="dice-3d">🎲</div>
  </div>
  <div id="l-msg" class="info-msg">برای شروع ۶ بیاورید!</div>

  <div class="board-viewport">
    <div class="board-3d">
      <table id="ludo-grid" class="ludo-table"></table>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-back" onclick="openMenu()">منو</button>
    <button class="btn btn-back" onclick="resetLudo()">دوباره 🔄</button>
  </div>
</div>

<script>
if(window.Telegram && window.Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }

const DICE = {1:'⚀',2:'⚁',3:'⚂',4:'⚃',5:'⚄',6:'⚅'};

function openGame(g){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if(g === 'snake'){
    document.getElementById('screen-snake').classList.add('active');
    buildSnakeGrid();
  } else {
    document.getElementById('screen-ludo').classList.add('active');
    buildLudoBoard();
  }
}

function openMenu(){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-menu').classList.add('active');
}

/* ================= مار و پله ================= */
const SNAKES = {16:6, 47:26, 49:11, 56:53, 62:19, 64:60, 87:24, 93:73, 95:75, 98:78};
const LADDERS = {1:38, 4:14, 9:31, 21:42, 28:84, 36:44, 51:67, 71:91, 80:100};
let sPos = [0, 0], sTurn = 0, sDone = false;

function cellNum(r, c) {
  let b = 9 - r;
  return b % 2 === 0 ? b * 10 + c + 1 : b * 10 + 10 - c;
}

  t.innerHTML = '';
  for(let r=0; r<10; r++){
